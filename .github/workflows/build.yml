name: Build GoogleEnhancer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build tweak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            make \
            clang \
            git \
            perl \
            curl \
            wget \
            dpkg \
            fakeroot \
            build-essential

      - name: Install ldid
        run: |
          git clone https://github.com/ldid-project/ldid.git
          cd ldid
          make
          sudo cp ldid /usr/local/bin/ldid
          ldid -h

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Check environment
        run: |
          echo "THEOS=$THEOS"
          ls $THEOS
          ls $THEOS/sdks

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Show package
        run: |
          ls -la packages/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: GoogleEnhancer-deb
          path: packages/*.deb
          if-no-files-found: error